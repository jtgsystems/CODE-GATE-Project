<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Scanner - Cinematic Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #0a0a0a;
            --surface-elevated: #1a1a1a;
            --accent: #ffffff;
            --critical: #ff3c3c;
            --high: #ff8c3c;
            --medium: #ffcc3c;
            --low: #3c8cff;
            --info: #8c8c8c;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--accent);
            font-family: 'Manrope', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        
        /* Header & Dashboard */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 60px; padding: 20px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
        }
        .project-info h1 { margin: 0; font-weight: 800; letter-spacing: -1px; font-size: 2rem; }
        .stats { display: flex; gap: 40px; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 2.5rem; font-weight: 800; line-height: 1; }
        .stat-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; opacity: 0.5; margin-top: 5px; }

        /* Grade Badge */
        .grade-badge {
            font-size: 3rem; font-weight: 800; padding: 10px 30px; border-radius: 15px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%); color: #000;
            box-shadow: 0 0 40px rgba(255,255,255,0.1);
        }
        .grade-A { background: linear-gradient(135deg, #00ff88 0%, #00bcff 100%); }
        .grade-f { background: linear-gradient(135deg, #ff3c3c 0%, #991b1b 100%); color: #fff; }

        /* Issues List */
        .issue-section { margin-bottom: 80px; }
        .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
        
        .issue-card {
            background: var(--surface); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 20px; margin-bottom: 15px;
            transition: transform 0.2s, border-color 0.2s;
            display: grid; grid-template-columns: 80px 1fr 200px; gap: 20px; align-items: start;
        }
        .issue-card:hover { transform: translateX(5px); border-color: rgba(255,255,255,0.3); }
        
        .severity { 
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase; 
            padding: 4px 8px; border-radius: 4px; text-align: center;
        }
        .sev-critical { background: var(--critical); color: #fff; }
        .sev-high { background: var(--high); color: #000; }
        .sev-medium { background: var(--medium); color: #000; }
        .sev-low { background: var(--low); color: #fff; }
        .sev-info { background: var(--info); color: #fff; }

        .issue-content h3 { margin: 0 0 10px 0; font-size: 1.1rem; font-weight: 600; }
        .issue-content .meta { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.6; margin-bottom: 10px; }
        .issue-content .desc { font-size: 0.95rem; opacity: 0.8; }
        
        .visual-evidence { margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid var(--glass-border); }
        .visual-evidence img { width: 100%; display: block; filter: brightness(0.8); transition: filter 0.3s; }
        .visual-evidence img:hover { filter: brightness(1); }

        .file-link { color: var(--low); text-decoration: none; border-bottom: 1px solid transparent; }
        .file-link:hover { border-bottom-color: var(--low); }

        footer { text-align: center; padding: 60px 0; opacity: 0.3; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="project-info">
                <div class="stat-label">Project Quality Audit</div>
                <h1>CODE-GATE-PROJECT</h1>
                <div class="stat-label" style="margin-top:10px;">Scanned on 2/3/2026, 9:27:23 PM</div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value">100</span>
                    <span class="stat-label">Score</span>
                </div>
                <div class="stat-item">
                    <div class="grade-badge grade-A">A</div>
                    <span class="stat-label">Grade</span>
                </div>
            </div>
        </header>

        

        <footer>
            GENERATED BY ULTIMATE SCANNER v2.0 - SOTA 2026 STANDARDS
        </footer>
    </div>
</body>
</html>
